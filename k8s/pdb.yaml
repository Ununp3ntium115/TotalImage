---
# Pod Disruption Budgets for High Availability
# Ensures at least one pod remains available during voluntary disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: totalimage-web-pdb
  labels:
    app: totalimage
    component: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: totalimage
      component: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: totalimage-mcp-pdb
  labels:
    app: totalimage
    component: mcp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: totalimage
      component: mcp
