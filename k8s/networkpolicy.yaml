---
# Network Policies for Security Isolation
# Restricts network traffic between pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: totalimage-web-netpol
  labels:
    app: totalimage
    component: web
spec:
  podSelector:
    matchLabels:
      app: totalimage
      component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
    # Allow ingress from within namespace (for metrics)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow egress to fire-marshal
    - to:
        - podSelector:
            matchLabels:
              app: totalimage
              component: fire-marshal
      ports:
        - protocol: TCP
          port: 3001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: totalimage-mcp-netpol
  labels:
    app: totalimage
    component: mcp
spec:
  podSelector:
    matchLabels:
      app: totalimage
      component: mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3002
    # Allow ingress from within namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3002
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow egress to fire-marshal
    - to:
        - podSelector:
            matchLabels:
              app: totalimage
              component: fire-marshal
      ports:
        - protocol: TCP
          port: 3001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fire-marshal-netpol
  labels:
    app: totalimage
    component: fire-marshal
spec:
  podSelector:
    matchLabels:
      app: totalimage
      component: fire-marshal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only allow ingress from totalimage pods
    - from:
        - podSelector:
            matchLabels:
              app: totalimage
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
