---
# ServiceMonitor for Prometheus Operator
# Enables automatic metrics scraping by Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: totalimage-web
  labels:
    app: totalimage
    component: web
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: totalimage
      component: web
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
